- date: "Aug 2026"
  text: >-
    Gave a plenary talk, <em>Orchestrating Multi-Robot Collaboration: From Aerial Drones to
    Heavy Machinery</em>, at the 17th Multidisciplinary International Student Workshop
    (MISW 2026), Institute of Science Tokyo.

- date: "Feb 2026"
  text: >-
    Our work on hyperspectral imaging for rice plants cultivated in closed plant factories
    was presented at the <strong>3rd BrIAS Conference on Smart Agriculture</strong>,
    Brussels, Belgium.

- date: "Nov 2025"
  text: >-
    Started as a <strong>Robotics Control Engineer</strong> at
    <a href="https://deepx.co.jp/" target="_blank" rel="noopener">DeepX, Inc.</a> in Tokyo,
    working on autonomous construction machinery.

- date: "Sep 2025"
  text: >-
    Completed my <strong>Ph.D. in Systems and Control Engineering</strong> at the
    Institute of Science Tokyo, advised by Prof. Takeshi Hatanaka.

- date: "Jul 2025"
  text: >-
    Submitted my doctoral dissertation, <em>Multi-Drone Coordinated Image Sampling for 3D Map
    Reconstruction through Efficient and Scene-Adaptive Coverage Control</em>.

- date: "Jul 2025"
  text: >-
    <em>Coverage-Recon: Coordinated Multi-Drone Image Sampling with Online Map Feedback</em>
    is under review at <strong>IEEE Transactions on Control Systems Technology</strong>.

- date: "May 2025"
  text: >-
    Invited talk, <em>Drones Meet 3D-AI: Multi-Drone Collaboration for 3D Reconstruction</em>,
    at the Tokyo AI &times; Drones session in Tokyo.

- date: "Mar 2025"
  text: >-
    Two papers accepted for presentation at the <strong>2025 European Control Conference</strong>
    &mdash; on real-time map feedback for coordinated image sampling, and on hierarchical
    multi-robot data sampling through online Gaussian processes.

- date: "Jan 2025"
  text: >-
    Joined <strong>FBTriangle</strong> as a simulation software engineer intern, developing a
    coverage control algorithm for optimal defensive formations in ice hockey.


