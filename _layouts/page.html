---
layout: default
---
<article class="section page">
  <div class="wrap">
    <header class="page-head">
      {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
