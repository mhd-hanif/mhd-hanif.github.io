# Site settings
locale                   : "en-US"
title                    : "Muhammad Hanif"
title_separator          : "·"
name                     : &name "Muhammad Hanif"
description              : &description "Robotics control engineer working on multi-robot coordination, coverage control and 3D reconstruction. Ph.D. in Systems and Control Engineering, Institute of Science Tokyo."
url                      : https://mhd-hanif.github.io
baseurl                  : ""
repository               : "mhd-hanif/mhd-hanif.github.io"
og_image                 : "/images/og-image.png"

# Author / profile
author:
  name             : "Muhammad Hanif"
  avatar           : "profile-hanif.jpg"
  tagline          : "Robotics Control Engineer"
  affiliation      : "DeepX, Inc."
  affiliation_url  : "https://deepx.co.jp/"
  location         : "Tokyo, Japan"
  email            : "hanif@hfg.sc.e.titech.ac.jp"
  googlescholar    : "https://scholar.google.com/citations?user=sgbkglMAAAAJ&hl=en"
  orcid            : "https://orcid.org/0009-0001-0475-8711"
  researchgate     : "https://www.researchgate.net/profile/Muhammad-Hanif-123"
  github           : "https://github.com/mhd-hanif"
  linkedin         : "https://www.linkedin.com/in/muhammad-hanif-6189b0157/"
  cv               : "/files/CV_Hanif.pdf"

# Publication categories, in the order they appear on /publications/
publication_category:
  manuscripts:
    title: "Journal Articles"
  books:
    title: "Book Chapters"
  conferences:
    title: "Conference Papers"
  domestic:
    title: "Domestic Conferences & Invited Talks"
  thesis:
    title: "Theses"
  patents:
    title: "Patents"

# Build settings
markdown: kramdown
highlighter: rouge
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
excerpt_separator: "\n\n"
timezone: Asia/Tokyo
future: true

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - node_modules
keep_files:
  - .git

permalink: /:categories/:title/

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project
  - scope:
      path: ""
      type: talks
    values:
      layout: page
  - scope:
      path: ""
      type: teaching
    values:
      layout: page

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
