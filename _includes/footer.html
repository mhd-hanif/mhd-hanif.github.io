<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-name">{{ site.author.name }}</p>
    <p class="footer-meta">
      {{ site.author.tagline }} &middot; {{ site.author.location }}
      &middot; <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </p>
    <p class="footer-meta footer-colophon">
      Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a>,
      hosted on GitHub Pages. &copy; {{ site.time | date: "%Y" }} {{ site.author.name }}.
    </p>
  </div>
</footer>
